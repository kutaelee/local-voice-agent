# Derived from vLLM-Omni 0.24.0 vllm_omni/deploy/qwen3_tts.yaml.
# This workstation profile preserves raw PCM async chunking while bounding the
# two same-GPU stages for one interactive phone session.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      # One frame minimizes TTFA but audibly changes timbre while the codec
      # accumulates context. Start with one normal chunk for stable quality.
      initial_codec_chunk_frames: 25
      decode_cudagraph_capture_sizes: [25, 73, 97, 169, 325]

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.08
    # The 1.7B talker weights exceed the 8% profiling budget even though the
    # card still has ample physical memory. A bounded explicit cache avoids
    # both the false zero-cache startup failure and a larger dynamic reserve.
    kv_cache_memory_bytes: 402653184
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: true
    max_num_batched_tokens: 512
    # A spoken response unit is bounded well below this limit. Keeping 4096
    # requires 0.44 GiB of KV cache, which does not fit the 8% phone-session
    # profile (0.37 GiB available).
    max_model_len: 3072
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.08
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0
